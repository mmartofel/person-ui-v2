# Builds the image (Dockerfile, with docker or podman) and deploys deploy/overlays/<profile> to the current kube context and namespace
# (README "Deploy", docs/DEPLOY-CONVENTION.md). Nothing here names a cluster, registry or namespace:
#   skaffold dev                                                     # local cluster, UI on localhost:5173
#   skaffold run -p openshift --default-repo=quay.io/<org> -n <ns>   # or -p kubernetes
#   DEPLOY_OVERLAY=deploy/environments/<env> skaffold run -p ...     # an environment overlay instead of the profile's
# Install the API stack first, from its own repo, into the same namespace (README "Deploy").
apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: person-ui-v2
build:
  artifacts:
    - image: person-ui-v2
      # docker or podman, whichever is installed (deploy/build-image.sh); no daemon socket setup needed.
      custom:
        buildCommand: sh deploy/build-image.sh
        dependencies:
          dockerfile:
            path: Dockerfile
  tagPolicy:
    gitCommit: {}
manifests:
  kustomize:
    paths:
      - '{{ default "deploy/overlays/local" .DEPLOY_OVERLAY }}'
deploy:
  kubectl: {}
portForward:
  # The realm accepts redirects to localhost:5173, the dev server's port.
  - resourceType: service
    resourceName: person-ui-v2
    port: 8080
    localPort: 5173
profiles:
  - name: openshift
    patches:
      - op: replace
        path: /manifests/kustomize/paths/0
        value: '{{ default "deploy/overlays/openshift" .DEPLOY_OVERLAY }}'
      - op: remove
        path: /portForward
  - name: kubernetes
    patches:
      - op: replace
        path: /manifests/kustomize/paths/0
        value: '{{ default "deploy/overlays/kubernetes" .DEPLOY_OVERLAY }}'
      - op: remove
        path: /portForward
