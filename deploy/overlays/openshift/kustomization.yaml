# OpenShift, any cluster and namespace: the base, a Route with a host OpenShift generates
# (person-ui-v2-<namespace>.<apps domain>) and the Topology view's labels. The realm's login pages are on that same
# host through the UI's nginx, so nothing here names a host.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - route.yaml
patches:
  - path: topology-ui.yaml
