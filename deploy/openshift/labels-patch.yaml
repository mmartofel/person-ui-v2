# Developer > Topology: the runtime icon, the application group shared with the API stack, and the arrow to Keycloak
# (the annotation's value comes from params.env). Deployment metadata only: the selector is immutable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: person-ui-v2
  labels:
    app.openshift.io/runtime: nginx
    app.kubernetes.io/name: person-ui-v2
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: person-app
  annotations:
    app.openshift.io/connects-to: CONNECTS_TO
